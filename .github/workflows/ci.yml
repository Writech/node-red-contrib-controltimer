name: ci
on:
    pull_request:
        branches: [master]
        types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run tidy:lint

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build

    unit-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run test:unit

    integration-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run test:integration

    changeset:
        # The "Version Packages" PR consumes the changesets, so it can't contain one.
        # PRs that need no release (CI, docs, tests) get the "no-changeset" label instead.
        if: >-
            github.head_ref != 'changeset-release/master' &&
            !contains(github.event.pull_request.labels.*.name, 'no-changeset')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Check for a changeset
              run: |
                  npx changeset status --since=origin/master || {
                    echo "::error::No changeset found. Run 'npx changeset' and commit the file."
                    echo "::error::For changes that need no release (CI, docs, tests), add the 'no-changeset' label to the PR."
                    exit 1
                  }
