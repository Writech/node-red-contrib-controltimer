name: ci
on:
    pull_request:
        branches: [master]
        types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint

    typecheck-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run typecheck:tests

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run test:build

    unit-tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run test:unit

    integration-tests:
        name: integration-tests (node ${{ matrix.node-version }}, node-red ${{ matrix.node-red-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]
                node-red-version: ["3.1", "4.1", "5"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm install --no-save node-red@${{ matrix.node-red-version }}
            - run: npm run test:integration

    coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run test:coverage

    # The one check to require in the branch ruleset. Matrix jobs have no parent check of their own,
    # so adding jobs or matrix entries only needs this list updated here, not in the GitHub UI.
    ci-passed:
        if: always()
        needs: [lint, typecheck-tests, build, unit-tests, integration-tests, coverage]
        runs-on: ubuntu-latest
        steps:
            - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: |
                  echo "::error::A required job failed or was cancelled."
                  exit 1

    changeset:
        # The "Version Packages" PR consumes the changesets, so it can't contain one.
        # PRs that need no release (CI, docs, tests) get the "no-changeset" label instead.
        if: >-
            github.head_ref != 'changeset-release/master' &&
            !contains(github.event.pull_request.labels.*.name, 'no-changeset')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Check for a changeset
              run: |
                  npx changeset status --since=origin/master || {
                    echo "::error::No changeset found. Run 'npx changeset' and commit the file."
                    echo "::error::For changes that need no release (CI, docs, tests), add the 'no-changeset' label to the PR."
                    exit 1
                  }
